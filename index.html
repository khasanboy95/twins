<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <title>LC-UP</title>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=Edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="O'quv markazlarni avtomatlashtish uchun crm sistema">
    <meta name="keywords" content="LC-UP, O'quv markaz, Ta'lim, Avtomatlashtirish, Admin Panel">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --main-font: "Inter";
            --main-white: rgba(255, 255, 255, 1);
            --main-primary: rgba(82, 114, 190, 1);
            --main-dark: rgba(0, 0, 0, 0.25);
            --main-danger: rgba(245, 34, 45, 1);
            --input-border-color: rgba(217, 217, 217, 1);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--main-font), sans-serif;
            background-color: rgb(248, 246, 242);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
        }

        body::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url("assets/images/auth.png");
            background-repeat: repeat;
            background-position: 0% 0%;
            opacity: 0.9;
            z-index: -1;
        }

        .page-body {
            width: 100%;
            padding: 0.5rem 0;
        }

        .container {
            max-width: 100%;
            padding: 0 1rem;
            margin: 0 auto;
        }

        .login-wrapper {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            margin-top: 3rem;
        }

        .card {
            background-color: var(--main-white);
            border-radius: 8px;
            box-shadow: rgba(25, 26, 28, 0.075) 0px 2px 4px 0px;
            width: 100%;
            max-width: 32rem;
            padding: 2rem;
            border: none;
        }

        .logo-container {
            margin-bottom: 2.5rem;
        }

        .logo-container img {
            width: 100%;
            height: 120px;
            object-fit: contain;
        }

        .form-group {
            margin-bottom: 0.5rem;
        }

        .main-input-group {
            position: relative;
            margin-bottom: 0.5rem;
        }

        .main-input-group label {
            font-family: var(--main-font), sans-serif;
            font-size: 14px;
            font-weight: 400;
            line-height: 22px;
            display: block;
            margin-bottom: 2px;
        }

        .main-input-group .form-control {
            display: block;
            border: 1px solid var(--input-border-color);
            background-color: var(--main-white);
            padding: 0 12px;
            border-radius: 8px;
            height: 40px;
            width: 100%;
            font-family: var(--main-font), sans-serif;
            font-size: 14px;
            color: #333;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .main-input-group .form-control::placeholder {
            color: rgba(0, 0, 0, 0.25);
        }

        .main-input-group .form-control:focus,
        .main-input-group .form-control:hover {
            border-color: var(--main-primary) !important;
            cursor: pointer;
            box-shadow: 0 0 0 2px rgba(5, 145, 255, 0.1);
        }

        .main-input-group .password-toggle {
            position: absolute;
            right: 10px;
            top: 35px;
            color: var(--input-border-color);
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
            font-size: 14px;
        }

        .main-input-group .password-toggle:hover {
            color: #999;
        }

        .btn-primary {
            display: block;
            width: 100%;
            background-color: var(--main-primary);
            color: var(--main-white);
            border: none;
            border-radius: 6px;
            padding: 0.5rem 1rem;
            font-size: 14px;
            font-weight: 500;
            font-family: var(--main-font), sans-serif;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: opacity 0.2s;
            margin-top: 1.5rem;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        .btn-primary:active {
            opacity: 0.8;
        }

        @media (min-width: 768px) {
            .card {
                padding: 3rem;
            }
            .login-wrapper {
                margin-top: 1.5rem;
            }
        }

        @media (min-width: 1200px) {
            .page-body {
                padding: 0.5rem 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="page-body">
        <div class="container">
            <div class="login-wrapper">
                <div class="card">
                    <div class="logo-container">
                        <img src="assets/images/logo.png" alt="Twins">
                    </div>

                    <form id="loginForm" onsubmit="return false;">
                        <div class="form-group">
                            <div class="main-input-group">
                                <label>Telefon raqam</label>
                                <input type="text" id="phone" class="form-control" placeholder="+(998)-__-___-__-__" autocomplete="off">
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="main-input-group">
                                <label>Parol</label>
                                <input type="password" id="password" class="form-control" placeholder="***************" autocomplete="off">
                                <button type="button" class="password-toggle" onclick="togglePassword()">
                                    <i id="eyeIcon" class="fa fa-eye-slash"></i>
                                </button>
                            </div>
                        </div>
                        <button type="button" class="btn-primary" id="loginButton" onclick="handleLogin()">KIRISH</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/inputmask@5.0.8/dist/inputmask.min.js"></script>
    <script>
        // Phone number input mask
        Inputmask({
            mask: "+(999) 99-999-99-99",
            placeholder: "_",
            showMaskOnHover: false,
            onBeforePaste: function (pastedValue) {
                return pastedValue.replace(/[^\d]/g, '');
            }
        }).mask("#phone");

        // Set default country code
        document.getElementById('phone').value = '998';

        // Toggle password visibility
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            }
        }

        // Handle login button
        function handleLogin() {
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            if (!phone || !password) {
                alert("Telefon raqam va parolni kiriting!");
                return;
            }
            const btn = document.getElementById('loginButton');
            btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i>';
            btn.disabled = true;
            // Simulate login request
            setTimeout(() => {
                btn.innerHTML = 'KIRISH';
                btn.disabled = false;
            }, 2000);
        }

        // Enter key to submit
        document.getElementById('password').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('loginButton').click();
            }
        });
    </script>
</body>
</html>
